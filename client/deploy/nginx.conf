# Static host for the Unity WebGL player.
#
# The build uses Brotli compression with "Decompression Fallback" OFF
# (ProjectSettings: webGLCompressionFormat 0, webGLDecompressionFallback 0),
# so every payload is a pre-compressed *.br file and the server MUST send
# `Content-Encoding: br` itself. Without these headers the browser hands raw
# Brotli bytes to the loader and the game dies with
# "Unable to parse Build/<name>.framework.js.br".
server {
    listen 80;
    # The nginx image's 10-listen-on-ipv6-by-default.sh normally adds this, but it
    # cannot patch a read-only mounted config. Without it `localhost` inside the
    # container resolves to ::1 first and the healthcheck fails — which makes
    # Traefik drop the container from the load balancer and answer 503.
    listen [::]:80;
    server_name _;
    # /srv is the host directory the deploy script rsyncs into; `current` is a
    # symlink to the newest release, swapped atomically after the upload finishes.
    root /srv/current;
    index index.html;

    # Payloads are already compressed; re-compressing wastes CPU and breaks nothing else.
    gzip off;

    # Redirects (directory slashes) go out as a relative Location. nginx would
    # otherwise build an absolute one from its own view — http:// and port 80 —
    # while players come in over https through Traefik.
    absolute_redirect off;

    # Cache-Control on every payload below is `no-cache` — "revalidate before
    # reuse", NOT "never cache": nginx still answers 304 from ETag, so a repeat
    # visit downloads nothing.
    #
    # It is deliberately not `immutable`: whether the payload URLs change between
    # releases depends on "Name Files As Hashes", which a Build Profile can
    # override either way (web_dev has it on, ProjectSettings off). With it off
    # every release reuses build.wasm.br / build.framework.js.br with different
    # content; cached immutably, a browser pairs the previous framework with the
    # new wasm and the game dies on load with "RuntimeError: function signature
    # mismatch". `no-cache` is correct for both settings and costs one 304 per file.

    # Regex locations are evaluated in order — the typed ones must come first,
    # otherwise the generic `\.br$` rule below wins and the MIME type is lost.
    location ~* \.wasm\.br$ {
        add_header Content-Encoding br;
        add_header Cache-Control "no-cache";
        default_type application/wasm;
    }

    location ~* \.js\.br$ {
        add_header Content-Encoding br;
        add_header Cache-Control "no-cache";
        default_type application/javascript;
    }

    location ~* \.json\.br$ {
        add_header Content-Encoding br;
        add_header Cache-Control "no-cache";
        default_type application/json;
    }

    # Everything else Unity emits: level*.br, sharedassets*.br, boot.config.br,
    # global-metadata.dat.br, resources.assets.br, ...
    location ~* \.br$ {
        add_header Content-Encoding br;
        add_header Cache-Control "no-cache";
        default_type application/octet-stream;
    }

    # The loader is the only uncompressed script (build.loader.js, or
    # <hash>.loader.js with "Name Files As Hashes" on).
    location ~* ^/Build/[^/]+\.loader\.js$ {
        add_header Cache-Control "no-cache";
    }

    # index.html points at the current build — always revalidate.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Everything uncompressed that is not matched above: StreamingAssets/aa
    # (settings.json, catalog.bin, bundles), TemplateData, the loading sprite.
    # Without an explicit Cache-Control the browser caches these heuristically
    # (a fraction of their Last-Modified age) and serves them from disk without
    # asking — after a release that pairs the new wasm with the previous
    # Addressables catalog.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
