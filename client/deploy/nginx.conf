# Static host for the Unity WebGL player.
#
# The build uses Brotli compression with "Decompression Fallback" OFF
# (ProjectSettings: webGLCompressionFormat 0, webGLDecompressionFallback 0),
# so every payload is a pre-compressed *.br file and the server MUST send
# `Content-Encoding: br` itself. Without these headers the browser hands raw
# Brotli bytes to the loader and the game dies with
# "Unable to parse Build/build.framework.js.br".
server {
    listen 80;
    server_name _;
    # /srv is the host directory the deploy script rsyncs into; `current` is a
    # symlink to the newest release, swapped atomically after the upload finishes.
    root /srv/current;
    index index.html;

    # Payloads are already compressed; re-compressing wastes CPU and breaks nothing else.
    gzip off;

    # Regex locations are evaluated in order — the typed ones must come first,
    # otherwise the generic `\.br$` rule below wins and the MIME type is lost.
    location ~* \.wasm\.br$ {
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/wasm;
    }

    location ~* \.js\.br$ {
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/javascript;
    }

    location ~* \.json\.br$ {
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/json;
    }

    # Everything else Unity emits: level*.br, sharedassets*.br, boot.config.br,
    # global-metadata.dat.br, resources.assets.br, ...
    location ~* \.br$ {
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/octet-stream;
    }

    # build.loader.js is the only uncompressed script; it is regenerated on every
    # build, so it must not be cached alongside the immutable payloads.
    location = /Build/build.loader.js {
        add_header Cache-Control "public, max-age=300";
    }

    # index.html points at the current build — always revalidate.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
