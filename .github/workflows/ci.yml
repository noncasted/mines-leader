name: CI

# Builds and tests the backend (unit + Orleans test cluster). Unity tests are not run here; the container source
# generator is checked by the CI of the framework (tools/framework).

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'tools/framework'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'tools/framework'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # The framework (backend Common/Infrastructure/Cluster/Console, protocol base) is the tools/framework
      # submodule, a private repository: FRAMEWORK_TOKEN is a token with read access to noncasted/framework.
      - name: Checkout backend, shared and the framework
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true
          token: ${{ secrets.FRAMEWORK_TOKEN }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build backend
        run: dotnet build backend/backend.slnx

      # Tests use Microsoft Testing Platform: on the .NET 10 SDK `dotnet test` refuses the VSTest
      # target, so the test executable is run directly (see .claude/docs/TESTING.md).
      # Postgres comes from Testcontainers (DatabaseFixture starts postgres:17 through the runner's
      # Docker), Orleans runs as an in-process test cluster; no external services are needed.
      - name: Test backend
        run: backend/Tools/Tests/bin/Debug/net10.0/Tests

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-logs
          path: |
            backend/Tools/Tests/bin/Debug/net10.0/TestResults/
            /tmp/orleans-test-*.log
          if-no-files-found: ignore
