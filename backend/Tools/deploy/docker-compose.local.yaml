# Local smoke-test overlay.
# Uses pre-published artefacts from ./publish/<Name>/ at the repo root
# (populate via ./tools/scripts/publish-local.sh).
# Swaps the full-build Dockerfile for a runtime-only one — docker build becomes seconds.
#
# Usage (from repo root):
#   ./tools/scripts/publish-local.sh
#   docker compose --env-file backend/Tools/deploy/.env.local \
#     -f backend/Tools/deploy/docker-compose.yaml \
#     -f backend/Tools/deploy/docker-compose.local.yaml up --build -d

# Prod has two networks (the Coolify Destination + the shared `observability` of the logs and traces stack) — locally
# there is no Coolify bridge, so the Destination becomes a plain local bridge. Both stay external (no compose-created
# network, see docker-compose.yaml): create them once with
#   docker network create mines-leader-local && docker network create observability
# The observability stack itself is optional locally (tools/framework/deploy/observability/README.md): without it the
# services start, only their logs, traces and the console's backend trace pages are empty.
networks:
  mines-leader-production:
    name: mines-leader-local
    driver: bridge

services:
  migrator:
    build:
      context: ../../..
      dockerfile: ./backend/Tools/DeploySetup/Dockerfile
  silo:
    build:
      dockerfile: ./backend/Orchestration/Dockerfile.prebuilt
      args:
        PUBLISH_DIR: publish/Silo
        ASSEMBLY_NAME: Silo

  coordinator:
    build:
      dockerfile: ./backend/Orchestration/Dockerfile.prebuilt
      args:
        PUBLISH_DIR: publish/Coordinator
        ASSEMBLY_NAME: Coordinator

  meta:
    build:
      dockerfile: ./backend/Orchestration/Dockerfile.prebuilt
      args:
        PUBLISH_DIR: publish/MetaGateway
        ASSEMBLY_NAME: MetaGateway
    ports:
      - "7100:8080"

  game:
    build:
      dockerfile: ./backend/Orchestration/Dockerfile.prebuilt
      args:
        PUBLISH_DIR: publish/GameGateway
        ASSEMBLY_NAME: GameGateway
    ports:
      - "7101:8080"

  console:
    build:
      dockerfile: ./backend/Orchestration/Dockerfile.prebuilt
      args:
        PUBLISH_DIR: publish/ConsoleGateway
        ASSEMBLY_NAME: ConsoleGateway
    ports:
      - "7102:8080"
